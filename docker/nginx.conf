server {
    listen 80;
    server_name _;
    client_max_body_size 50m;  # handbook PDF uploads

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        # Server-Sent Events: stream tokens immediately, allow slow generations / PDF ingestion.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location / {
        try_files $uri /index.html;
    }
}
