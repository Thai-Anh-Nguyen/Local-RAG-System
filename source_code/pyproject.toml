[project]
name = "local-rag"
version = "0.1.0"
description = "Local RAG chatbot over a university major handbook (CS311 final project)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sse-starlette",
    "python-multipart",
    "pydantic-settings",
    "langchain-core",
    "langchain-text-splitters",
    "langchain-ollama",
    "langchain-chroma",
    "chromadb",
    "pymupdf4llm",
    "pypdf",
    "rank-bm25>=0.2.2",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/rag", "backend/api"]

[tool.pytest.ini_options]
testpaths = ["test/unit", "test/api"]
markers = [
    "e2e: needs the running stack (Ollama + Chroma)",
]
